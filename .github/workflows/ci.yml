name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Unit, архитектура, безопасность, контракт Pact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v --ignore=tests/integration --cov=app --cov=delivery_service --cov-report=term

  integration:
    name: Интеграционные тесты (Testcontainers, PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/integration -v

  migrations:
    name: Миграции Alembic на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sirius
          POSTGRES_PASSWORD: sirius
          POSTGRES_DB: sirius_food
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sirius"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sirius:sirius@localhost:5432/sirius_food
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: upgrade -> downgrade -> upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Модели совпадают с миграциями
        run: alembic check
      - name: CLI создаёт администратора
        run: python -m app.cli create-user admin@sirius.ru 'CiAdminPass123' --role admin
